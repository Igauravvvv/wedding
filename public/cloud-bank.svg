<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <radialGradient id="puff" cx="45%" cy="30%" r="70%">
      <stop stop-color="#fff" stop-opacity=".98"/>
      <stop offset=".5" stop-color="#fffdf7" stop-opacity=".92"/>
      <stop offset=".8" stop-color="#cfced6" stop-opacity=".48"/>
      <stop offset="1" stop-color="#ded8dc" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="3" seed="12" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="45" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <g fill="url(#puff)" filter="url(#soft)">
    <ellipse cx="210" cy="315" rx="210" ry="130"/>
    <ellipse cx="365" cy="250" rx="180" ry="155"/>
    <ellipse cx="540" cy="195" rx="185" ry="175"/>
    <ellipse cx="725" cy="255" rx="190" ry="150"/>
    <ellipse cx="930" cy="300" rx="220" ry="145"/>
    <ellipse cx="440" cy="335" rx="240" ry="140"/>
    <ellipse cx="690" cy="350" rx="260" ry="130"/>
  </g>
</svg>
